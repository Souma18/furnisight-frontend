<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/furnisight-logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FurniSight</title>
    <script>
      ;(() => {
        const localeKey = 'furnisight:locale'
        const locale = ['vi', 'en'].includes(localStorage.getItem(localeKey)) ? localStorage.getItem(localeKey) : 'vi'
        document.documentElement.lang = locale

        const key = 'furnisight:theme'
        const stored = localStorage.getItem(key)
        const preference = ['system', 'light', 'dark'].includes(stored) ? stored : 'system'
        const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        const theme = preference === 'system' ? system : preference
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.add(`theme-${theme}`)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.js"></script>
  </body>
</html>
